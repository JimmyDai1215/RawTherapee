name: Diagnose bundle
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - shell: bash
        run: |
          curl -fsSL -o dml.zip 'https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4'
          sha256sum dml.zip
          ls -la dml.zip
          unzip -q dml.zip -d dml
          find dml -type f | grep -v "arm\|x86-\|xbox" | xargs ls -la | awk '{print $5, $9}'
          sha256sum dml/bin/x64-win/DirectML.dll
          head -c 1500 dml/LICENSE.txt || true
          cat dml/*.nuspec | head -40
