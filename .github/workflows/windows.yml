name: Windows Build
on:
  push:
    branches:
      - dev
      - c1-custom
      - c1-stable
      - releases
      - 'release-[0-9]+.*'
    tags:
      - '[0-9]+.*'
  pull_request:
    branches:
      - dev
      - releases
      - 'release-[0-9]+.*'
  workflow_dispatch:

env:
  publish_pre_dev_labels: '[]'


jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        build_type: [release]
        arch: [x86_64]
    env:
      MSYS2_ENV_NAME: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
      MSYS2_ENV_PREFIX: ${{ matrix.arch == 'arm64' && 'clangarm64' || 'ucrt64' }}
    outputs:
      ARTIFACT_NAME_PREFIX: ${{ steps.prepare-artifact-name.outputs.ARTIFACT_NAME_PREFIX }}
      REF_NAME_FILTERED: ${{ steps.prepare-artifact-name.outputs.REF_NAME_FILTERED }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          location: C:\msys2
          update: true
          msystem: ${{env.MSYS2_ENV_NAME}}
          install: |
            git
            intltool
            unzip
          pacboy: |
            cc:p
            pkgconf:p
            cmake:p
            autotools:p
            ninja:p
            gtkmm3:p
            lcms2:p
            fftw:p
            lensfun:p
            libiptcdata:p
            libjxl:p
            exiv2:p
            ${{matrix.arch == 'x86_64' && '' || 'meson:p'}}

      - name: Install SIMDe
        if: ${{matrix.arch != 'x86_64'}}
        run: |
          echo "Cloning SIMDe source."
          git clone --depth 1 --branch 'v0.8.2' 'https://github.com/simd-everywhere/simde.git'
          echo "Setting up build directory."
          cd simde
          meson setup build
          echo "Configuring build."
          cd build
          meson configure -D tests=False
          echo "Building SIMDe."
          meson compile
          echo "Installing SIMDe."
          meson install

      - name: Get ONNX Runtime
        run: |
          # official ONNX Runtime build with DirectML (graphics card) support
          curl -fsSL -o ort.zip 'https://github.com/microsoft/onnxruntime/releases/download/v1.22.1/Microsoft.ML.OnnxRuntime.DirectML.1.22.1.nupkg'
          echo "9fe1d91a697fb8a68abd29fdc2a88dea8f864ee74e758a055ce63c9e023c6908  ort.zip" | sha256sum -c -
          unzip -o -q ort.zip -d ort
          # DirectML itself, the version this ONNX Runtime was built for
          curl -fsSL -o dml.zip 'https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4'
          echo "4e7cb7ddce8cf837a7a75dc029209b520ca0101470fcdf275c1f49736a3615b9  dml.zip" | sha256sum -c -
          unzip -o -q dml.zip -d dml
          echo "9c9e6d822561c6c41b90e6994b3e8857cf1d66dbfb1e0c4c799c7c89b4e92da1  dml/bin/x64-win/DirectML.dll" | sha256sum -c -
          echo "ORT_DIR=$(cygpath -m "$(pwd)/ort")" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Configure build
        run: |
          export REF_NAME_FILTERED="$(echo '${{github.ref_name}}' | sed 's/[^A-z0-9_.-]//g')"

          if [ '${{github.ref_type}}' == 'tag' ]; then
            export CACHE_SUFFIX=""
          else
            echo "Setting cache suffix."
            export CACHE_SUFFIX="5-$REF_NAME_FILTERED"
            echo "Cache suffix is '$CACHE_SUFFIX'."
          fi

          echo "Running CMake configure."
          cmake \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE='${{matrix.build_type}}' \
            -DCACHE_NAME_SUFFIX="$CACHE_SUFFIX" \
            -DPROC_TARGET_NUMBER="1" \
            -DLENSFUNDBDIR="share/lensfun" \
            -DONNXRT_INCLUDE_DIR="$ORT_DIR/build/native/include" \
            -DWITH_SIMDE="${{matrix.arch == 'x86_64' && 'OFF' || 'ON'}}" \
            -S . -B build

          echo "Recording filtered ref name."
          echo "REF_NAME_FILTERED=$REF_NAME_FILTERED" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Build RawTherapee
        run: |
          echo "Running CMake install."
          cmake --build build --target install

      - name: Include Lensfun
        run: |
          echo "Updating Lensfun database."
          PYTHONPATH=/${{env.MSYS2_ENV_PREFIX}}/lib/site-packages lensfun-update-data  # Workaround for lensfun path mismatch
          echo "Creating Lensfun directory in the build directory."
          mkdir -p 'build/${{matrix.build_type}}/share'
          echo "Copying Lensfun database to the build directory."
          cp -R "/C/msys2/msys64/${{env.MSYS2_ENV_PREFIX}}/var/lib/lensfun-updates/version_1" 'build/${{matrix.build_type}}/share/lensfun'

      - name: Include AI denoise model
        run: |
          export BUILD_DIR="$(pwd)/build/${{matrix.build_type}}"
          mkdir -p "$BUILD_DIR/models" "$BUILD_DIR/licenses"
          curl -fsSL -o rawnind.dtmodel 'https://github.com/darktable-org/darktable-ai/releases/download/release-5.6.0/rawdenoise-nind.dtmodel'
          echo "d71b5f1e727c85a359e6f74dca9e2016c9d8fc3e2f7ac3e9b347d80ceca969af  rawnind.dtmodel" | sha256sum -c -
          unzip -o -q rawnind.dtmodel -d rawnind_x
          cp rawnind_x/rawdenoise-nind/model_bayer.onnx "$BUILD_DIR/models/rawdenoise-nind-bayer.onnx"
          cp rawnind_x/rawdenoise-nind/config.json "$BUILD_DIR/models/rawdenoise-nind.json"
          curl -fsSL -o plksr.dtmodel 'https://github.com/darktable-org/darktable-ai/releases/download/release-5.6.0/upscale-realplksr.dtmodel'
          echo "7f7b4942b2363691628f10c52bce66ff3ac67d07d4d55c3804d3f89fc9cd6ba7  plksr.dtmodel" | sha256sum -c -
          unzip -o -q plksr.dtmodel -d plksr_x
          cp plksr_x/upscale-realplksr/model_x2.onnx "$BUILD_DIR/models/upscale-realplksr-x2.onnx"
          cp plksr_x/upscale-realplksr/config.json "$BUILD_DIR/models/upscale-realplksr.json"
          cp ort/runtimes/win-x64/native/onnxruntime.dll ort/runtimes/win-x64/native/onnxruntime_providers_shared.dll "$BUILD_DIR"
          cp dml/bin/x64-win/DirectML.dll "$BUILD_DIR"
          cp ort/LICENSE "$BUILD_DIR/licenses/onnxruntime-LICENSE.txt"
          cp ort/ThirdPartyNotices.txt "$BUILD_DIR/licenses/onnxruntime-ThirdPartyNotices.txt"
          cp dml/LICENSE.txt "$BUILD_DIR/licenses/DirectML-LICENSE.txt"
          cp dml/ThirdPartyNotices.txt "$BUILD_DIR/licenses/DirectML-ThirdPartyNotices.txt"
          ls -la "$BUILD_DIR/models"

      - name: Bundle dependencies
        run: |
          echo "Listing shared library dependencies."
          ldd "./build/${{matrix.build_type}}/rawtherapee.exe"
          echo "Finding DLLs to include."
          DLLS=($(ldd "./build/${{matrix.build_type}}/rawtherapee.exe" | grep "/${{env.MSYS2_ENV_PREFIX}}/bin/" | awk '{print($1)'}))
          echo "Required DLLs are: ${DLLS[*]}"

          echo "Getting workspace path."
          export BUILD_DIR="$(pwd)/build/${{matrix.build_type}}"
          echo "Build directory is '$BUILD_DIR'."
          echo "Changing working directory to MSYS2 ${{env.MSYS2_ENV_NAME}}."
          cd "/C/msys2/msys64/${{env.MSYS2_ENV_PREFIX}}"
          echo "Copying DLLs and EXEs."

          cd ./bin
          cp \
            "gdbus.exe" \
            "gspawn-win64-helper.exe" \
            "gspawn-win64-helper-console.exe" \
            ${DLLS[*]} \
            "$BUILD_DIR"
          cd -

          echo "Copying Adwaita theme."
          mkdir -p "$BUILD_DIR/share/icons/Adwaita"
          cd 'share/icons/Adwaita/'
          mkdir -p "$BUILD_DIR/share/icons/Adwaita/symbolic"
          cp -r \
            "symbolic/actions" \
            "symbolic/devices" \
            "symbolic/mimetypes" \
            "symbolic/places" \
            "symbolic/status" \
            "symbolic/ui" \
            "$BUILD_DIR/share/icons/Adwaita/symbolic"
          cp 'index.theme' "$BUILD_DIR/share/icons/Adwaita"
          cd -

          echo "Copying GDK pixbuf."
          mkdir -p "$BUILD_DIR/lib"
          cp -r 'lib/gdk-pixbuf-2.0' "$BUILD_DIR/lib/gdk-pixbuf-2.0"

          echo "Copying GLib schemas."
          mkdir -p "$BUILD_DIR/share/glib-2.0/schemas"
          cp 'share/glib-2.0/schemas/gschemas.compiled' "$BUILD_DIR/share/glib-2.0/schemas"

          echo "Creating GTK settings.ini."
          mkdir -p "$BUILD_DIR/share/gtk-3.0/"
          echo -e '[Settings]\ngtk-button-images=1' > "$BUILD_DIR/share/gtk-3.0/settings.ini"

          echo "Resolving DLL imports statically (ldd runs the program and can return an incomplete list)."
          UCRT_BIN="/C/msys2/msys64/${{env.MSYS2_ENV_PREFIX}}/bin"
          cd "$BUILD_DIR"
          QUEUE=(rawtherapee.exe rawtherapee-cli.exe gdbus.exe gspawn-win64-helper.exe gspawn-win64-helper-console.exe *.dll $(find lib -name '*.dll'))
          declare -A SEEN
          while [ ${#QUEUE[@]} -gt 0 ]; do
            F="${QUEUE[0]}"; QUEUE=("${QUEUE[@]:1}")
            [ -n "${SEEN[$F]}" ] && continue
            SEEN[$F]=1
            for D in $(objdump -p "$F" | grep 'DLL Name:' | awk '{print $3}'); do
              if [ ! -f "$D" ] && [ -f "$UCRT_BIN/$D" ]; then
                echo "Adding $D (needed by $F)"
                cp "$UCRT_BIN/$D" .
              fi
              [ -f "$D" ] && QUEUE+=("$D")
            done
          done
          echo "Starting the CLI without the MSYS2 folder on PATH."
          PATH="/usr/bin:/c/Windows/System32:/c/Windows" ./rawtherapee-cli.exe || { echo "CLI exit code $?"; exit 1; }
          cd -

      - name: Test AI denoise end to end
        run: |
          export BUILD_DIR="$(pwd)/build/${{matrix.build_type}}"
          mkdir -p aitest
          curl -fsSL -o aitest/sample.NEF 'https://github.com/letmaik/rawpy/raw/main/test/iss030e122639.NEF'
          echo "5922721d13f11795557d97fdeb0a60b900086c402bc82a848ff280d15b99ffd4  aitest/sample.NEF" | sha256sum -c -
          export PATH="/usr/bin:/c/Windows/System32:/c/Windows"
          cd aitest
          # first with the graphics card allowed (the runner may only have a software adapter), then CPU only
          time "$BUILD_DIR/rawtherapee-cli.exe" --ai-denoise sample.NEF sample_AI_auto.dng 1.0
          export RT_AI_DEVICE=cpu
          time "$BUILD_DIR/rawtherapee-cli.exe" --ai-denoise sample.NEF sample_AI.dng 1.0
          ls -la
          "$BUILD_DIR/rawtherapee-cli.exe" -q -Y -t -b8 -o dev_nef.tif -c sample.NEF
          "$BUILD_DIR/rawtherapee-cli.exe" -q -Y -t -b8 -o dev_dng.tif -c sample_AI.dng
          "$BUILD_DIR/rawtherapee-cli.exe" -q -Y -t -b8 -o dev_dng_auto.tif -c sample_AI_auto.dng
          time "$BUILD_DIR/rawtherapee-cli.exe" --ai-upscale sample.NEF up2x.tif 1800 1100 700 600
          ls -la

      - name: Compare AI denoise result with the original
        shell: pwsh
        run: |
          pip install numpy pillow tifffile | Out-Null
          python .github/aitest_compare.py aitest/dev_nef.tif aitest/dev_dng.tif
          python .github/aitest_compare.py aitest/dev_nef.tif aitest/dev_dng_auto.tif
          python .github/aitest_upscale.py aitest/up2x.tif 700 600

      - name: Create installer
        if: ${{matrix.build_type == 'release'}}
        working-directory: build/${{matrix.build_type}}
        shell: pwsh
        run: |
          echo "Installing Inno Setup."
          choco install innosetup
          echo "Setup file:"
          type "WindowsInnoSetup.iss"
          echo "Creating installer from script."
          iscc /F"installer" "WindowsInnoSetup.iss"

      - name: Prepare artifact name
        id: prepare-artifact-name
        run: |
          if [ '${{github.ref_type}}' == 'tag' ]; then
            ARTIFACT_NAME_PREFIX="RawTherapee_${REF_NAME_FILTERED}_win64"
          else
            echo "Getting RawTherapee version."
            export VERSION="$(grep -m 1 '^Version: .*$' './build/${{matrix.build_type}}/AboutThisBuild.txt' | sed 's/^Version: \(.\+\)$/\1/')"
            echo "Version is '$VERSION'."
            FILTERED_VERSION="$(echo "$VERSION" | sed 's/[^A-z0-9_.-]//g')"
            ARTIFACT_NAME_PREFIX="RawTherapee_${REF_NAME_FILTERED}_${FILTERED_VERSION}_win64"
          fi
          ARTIFACT_NAME="${ARTIFACT_NAME_PREFIX}_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Artifact name is '$ARTIFACT_NAME'."

          echo "Recording artifact name."
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$(cygpath -u $GITHUB_ENV)"
          echo "Recording RawTherapee version."
          echo "RT_VERSION=$VERSION" >> "$(cygpath -u $GITHUB_ENV)"

          echo "Saving artifact name and filtered ref name to outputs."
          echo "ARTIFACT_NAME_PREFIX=$ARTIFACT_NAME_PREFIX" >> "$(cygpath -u $GITHUB_OUTPUT)"
          echo "REF_NAME_FILTERED=$REF_NAME_FILTERED" >> "$(cygpath -u $GITHUB_OUTPUT)"

          echo "Renaming artifact."
          mv './build/${{matrix.build_type}}' "./build/$ARTIFACT_NAME"
          if [ -e './build/installer.exe' ]; then
            echo "Renaming installer."
            mv './build/installer.exe' "./build/$ARTIFACT_NAME.exe"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build\${{env.ARTIFACT_NAME}}

      - name: Upload installer
        if: ${{matrix.build_type == 'release'}}
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}.exe
          path: build\${{env.ARTIFACT_NAME}}.exe

  publish:
    needs: build
    runs-on: 'windows-latest'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [release]
        arch: [x86_64]
    env:
      ARTIFACT_NAME: ${{ format('{0}_{1}_{2}', needs.build.outputs.ARTIFACT_NAME_PREFIX, matrix.arch, matrix.build_type) }}
      REF_NAME_FILTERED: ${{needs.build.outputs.REF_NAME_FILTERED}}
    steps:
      - name: Initialize
        id: initialize
        if: ${{github.ref_type == 'tag' || github.ref_name == 'dev' || (github.event_name == 'pull_request' && contains(fromJSON(env.publish_pre_dev_labels), github.event.pull_request.head.label))}}
        run: |
          echo "Proceeding with job."

      - name: Download build artifact
        id: download-build-artifact
        if: ${{steps.initialize.outcome == 'success'}}
        uses: actions/download-artifact@v8
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build/${{env.ARTIFACT_NAME}}

      - name: Download installer
        id: download-installer
        if: ${{steps.download-build-artifact.outcome == 'success' && matrix.build_type == 'release'}}
        uses: actions/download-artifact@v8
        with:
          name: ${{env.ARTIFACT_NAME}}.exe
          path: build

      - name: Create ZIP archive
        if: ${{steps.download-build-artifact.outcome == 'success'}}
        shell: cmd
        working-directory: ./build
        run: |
          echo "Zipping artifact."
          7z a -tzip "%ARTIFACT_NAME%.zip" "./%ARTIFACT_NAME%"

      - name: Prepare for publishing
        id: prepare-for-publishing
        if: ${{github.ref_type == 'tag' || github.ref_name == 'dev'}}
        run: |
          echo "Setting publish name."
          PUBLISH_NAME="RawTherapee_${REF_NAME_FILTERED}_win64_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Publish name is '$PUBLISH_NAME'."
          if [ "$ARTIFACT_NAME" != "$PUBLISH_NAME" ]; then
            echo "Renaming ZIP file."
            cp "build/$ARTIFACT_NAME.zip" "build/$PUBLISH_NAME.zip"
            if [ -e "./build/$ARTIFACT_NAME.exe" ]; then
              echo "Renaming installer."
              mv "./build/$ARTIFACT_NAME.exe" "./build/$PUBLISH_NAME.exe"
            fi
          fi
          echo "Creating version file."
          cp "build/$ARTIFACT_NAME/AboutThisBuild.txt" "build/$PUBLISH_NAME-AboutThisBuild.txt"

          echo "Recording publish name."
          echo "PUBLISH_NAME=$PUBLISH_NAME" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Publish artifacts
        uses: softprops/action-gh-release@v3
        if: ${{steps.prepare-for-publishing.outcome == 'success'}}
        with:
          tag_name: nightly-github-actions
          files: |
            build/${{env.PUBLISH_NAME}}.zip
            build/${{env.PUBLISH_NAME}}-AboutThisBuild.txt

      - name: Publish installer
        uses: softprops/action-gh-release@v3
        if: ${{steps.prepare-for-publishing.outcome == 'success' && matrix.build_type == 'release'}}
        with:
          tag_name: nightly-github-actions
          files: build/${{env.PUBLISH_NAME}}.exe

      - name: Prepare for publishing pre-dev
        id: prepare-publish-pre-dev
        if: ${{github.event_name == 'pull_request' && contains(fromJSON(env.publish_pre_dev_labels), github.event.pull_request.head.label)}}
        run: |
          echo "Making ref name."
          REF_NAME_FILTERED="$(echo '${{github.event.pull_request.head.label}}' | tr ':' '_' | sed 's/[^A-z0-9_.-]//g')"
          echo "Ref name is '$REF_NAME_FILTERED'."

          echo "Setting publish name."
          PUBLISH_NAME="RawTherapee_${REF_NAME_FILTERED}_win64_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Publish name is '$PUBLISH_NAME'."
          if [ "$ARTIFACT_NAME" != "$PUBLISH_NAME" ]; then
            echo "Renaming ZIP file."
            cp "build/$ARTIFACT_NAME.zip" "build/$PUBLISH_NAME.zip"
            if [ -e "./build/$ARTIFACT_NAME.exe" ]; then
              echo "Renaming installer."
              mv "./build/$ARTIFACT_NAME.exe" "./build/$PUBLISH_NAME.exe"
            fi
          fi
          echo "Creating version file."
          cp "build/$ARTIFACT_NAME/AboutThisBuild.txt" "build/$PUBLISH_NAME-AboutThisBuild.txt"

          echo "Recording publish name."
          echo "PUBLISH_NAME=$PUBLISH_NAME" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Publish pre-dev artifacts
        uses: softprops/action-gh-release@v3
        if: ${{steps.prepare-publish-pre-dev.outcome == 'success'}}
        with:
          tag_name: pre-dev-github-actions
          repository: RawTherapee/RawTherapee
          files: |
            build/${{env.PUBLISH_NAME}}.zip
            build/${{env.PUBLISH_NAME}}-AboutThisBuild.txt

      - name: Publish pre-dev installer
        uses: softprops/action-gh-release@v3
        if: ${{steps.prepare-publish-pre-dev.outcome == 'success' && matrix.build_type == 'release'}}
        with:
          tag_name: pre-dev-github-actions
          repository: RawTherapee/RawTherapee
          files: build/${{env.PUBLISH_NAME}}.exe

  test-launch:
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [release]
        arch: [x86_64]
    env:
      ARTIFACT_NAME: ${{ format('{0}_{1}_{2}', needs.build.outputs.ARTIFACT_NAME_PREFIX, matrix.arch, matrix.build_type) }}
    steps:
      - name: Download build artifact
        id: download-build-artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build/${{env.ARTIFACT_NAME}}

      - name: Launch CLI
        working-directory: build/${{env.ARTIFACT_NAME}}
        run: |
          echo "Launching RawTherapee CLI."
          ./rawtherapee-cli.exe

      - name: Launch GUI
        working-directory: build/${{env.ARTIFACT_NAME}}
        run: |
          STATUS_FILE="rawtherapee-status.txt"
          SUCCESS_MESSAGE="success"
          FAILURE_MESSAGE="failure"

          echo "Launching RawTherapee GUI."
          ./rawtherapee.exe && echo $SUCCESS_MESSAGE > $STATUS_FILE || echo $FAILURE_MESSAGE > $STATUS_FILE &

          echo "Waiting 10 seconds for RawTherapee to start."
          sleep 10

          echo "Checking if RawTherapee launched successfully."
          if [ -f "$STATUS_FILE" ]; then
            $STATUS=$(cat "$STATUS_FILE")
            if [ "$STATUS" == "$FAILURE_MESSAGE" ]; then
              echo "RawTherapee failed to start."
              exit 1
            elif [ "$STATUS" == "$SUCCESS_MESSAGE" ]; then
              echo "RawTherapee started successfully."
            else
              echo "Unknown status: $STATUS"
              exit 1
            fi
          fi
          echo "RawTherapee is launching or has launched successfully."
